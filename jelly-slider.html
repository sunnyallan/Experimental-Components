<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minimal Matte Jelly Toggle</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f8fafc; /* Bright Slate 50 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            /* Prevent pull-to-refresh on mobile */
            overscroll-behavior: none;
        }

        #canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            /* Critical for mobile: disables browser handling of gestures so JS gets them all */
            touch-action: none; 
            -webkit-tap-highlight-color: transparent;
        }

        .ui-overlay {
            position: absolute;
            top: 10%;
            text-align: center;
            pointer-events: none;
            color: #94a3b8;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 1rem;
            letter-spacing: 2px;
            font-weight: 600;
            text-transform: uppercase;
            opacity: 0.5;
        }

        .status {
            font-size: 2.5rem;
            font-weight: 800;
            margin-top: 5px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #ec4899;
        }
        
        .status.visible {
            opacity: 1;
            transform: translateY(0);
        }

    </style>
</head>
<body>

    <div class="ui-overlay" id="overlay">
        <h1>Toggle</h1>
        <div class="status" id="status-text">OFF</div>
    </div>

    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

        // --- Configuration ---
        const CONFIG = {
            colorOff: 0xcbd5e1,    // Soft Grey
            colorOn: 0xec4899,     // Vibrant Pink
            
            // Physics
            springStiffness: 0.28, 
            springDamping: 0.72,
            
            // Dimensions
            jellyWidth: 8.5,       
            jellyHeight: 3.5,      
            jellyDepth: 5.5,       
            
            // Track Dimensions
            trackWidth: 16.0,      
            trackDepth: 0.8,       
            trackHeight: 1.0,      
            
            deformMultiplier: 1.0 
        };

        // --- State ---
        let state = {
            isOn: false,
            targetX: -CONFIG.trackWidth / 4, 
            currentX: -CONFIG.trackWidth / 4,
            velocity: 0,
            isDragging: false,
            time: 0
        };

        const container = document.getElementById('canvas-container');
        const statusText = document.getElementById('status-text');

        // --- Scene ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf8fafc); 
        // Adjusted fog to start much further back (85) so it doesn't touch the main component
        // Increased range (250) to cover the larger floor
        scene.fog = new THREE.Fog(0xf8fafc, 85, 250);

        // --- Camera ---
        const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 35, 35); 
        camera.lookAt(0, -2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(container.clientWidth, container.clientHeight);
        // OPTIMIZATION: Cap PixelRatio at 1.5 to reduce load on large 4k screens
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        
        // FIX: Add Tone Mapping to prevent overexposure/washout
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.85; // Slightly reduced exposure
        
        container.appendChild(renderer.domElement);

        // --- Lighting ---
        
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        // Main Light - Softened Shadows
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(0, 40, 5);
        dirLight.castShadow = true;
        
        // OPTIMIZATION: Reduced shadow map size (1024 -> 512). 
        // With high blur radius, the lower resolution is invisible but faster.
        dirLight.shadow.mapSize.width = 512;
        dirLight.shadow.mapSize.height = 512;
        dirLight.shadow.camera.near = 0.1;
        dirLight.shadow.camera.far = 50;
        dirLight.shadow.camera.left = -20;
        dirLight.shadow.camera.right = 20;
        dirLight.shadow.camera.top = 20;
        dirLight.shadow.camera.bottom = -20;
        dirLight.shadow.bias = -0.0001;
        dirLight.shadow.radius = 12; 
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xe2e8f0, 0.9);
        fillLight.position.set(0, 10, -10);
        scene.add(fillLight);

        // --- Geometry Construction ---

        const floorGroup = new THREE.Group();
        
        // Materials - UPDATED to match background for seamless blend
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0xf8fafc, // Matches background
            roughness: 0.4,
            metalness: 0.1
        });

        const trenchMat = new THREE.MeshStandardMaterial({ 
            color: 0xf8fafc, // Matches background for neumorphic feel
            roughness: 0.4,
            metalness: 0.1
        });

        // 1. Seamless Floor with Extruded Hole
        const floorShape = new THREE.Shape();
        // Increased floor size to push edges beyond the view/fog area
        const floorSize = 400;
        // Outer rectangle
        floorShape.moveTo(-floorSize/2, -floorSize/2);
        floorShape.lineTo(floorSize/2, -floorSize/2);
        floorShape.lineTo(floorSize/2, floorSize/2);
        floorShape.lineTo(-floorSize/2, floorSize/2);
        floorShape.closePath();

        // Inner Hole (Stadium Shape)
        const holeThickness = CONFIG.trackDepth;
        const straightLen = CONFIG.trackWidth - holeThickness;
        const radius = holeThickness / 2;
        
        const holePath = new THREE.Path();
        holePath.absarc(straightLen/2, 0, radius, Math.PI * 1.5, Math.PI * 0.5, false); // Right Cap
        holePath.absarc(-straightLen/2, 0, radius, Math.PI * 0.5, Math.PI * 1.5, false); // Left Cap
        holePath.closePath();
        
        floorShape.holes.push(holePath);

        const floorGeo = new THREE.ExtrudeGeometry(floorShape, {
            depth: 1, 
            bevelEnabled: true, 
            bevelThickness: 0.1, 
            bevelSize: 0.1, 
            bevelOffset: 0,
            bevelSegments: 16, 
            curveSegments: 48 // OPTIMIZATION: Reduced from 64 to 48
        });

        const floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.rotation.x = Math.PI / 2; 
        floorMesh.position.y = 0; 
        floorMesh.receiveShadow = true;
        floorGroup.add(floorMesh);


        // 2. Trench Bottom
        const bottomShape = new THREE.Shape();
        bottomShape.absarc(straightLen/2, 0, radius, Math.PI * 1.5, Math.PI * 0.5, false);
        bottomShape.absarc(-straightLen/2, 0, radius, Math.PI * 0.5, Math.PI * 1.5, false);
        bottomShape.closePath();
        
        const bottomGeo = new THREE.ShapeGeometry(bottomShape, 48); // OPTIMIZATION: Reduced from 64
        const bottomMesh = new THREE.Mesh(bottomGeo, trenchMat);
        bottomMesh.rotation.x = -Math.PI / 2;
        bottomMesh.position.y = -CONFIG.trackHeight; 
        bottomMesh.receiveShadow = true;
        floorGroup.add(bottomMesh);

        scene.add(floorGroup);

        // 3. Jelly Button
        const jellyGeo = new RoundedBoxGeometry(
            CONFIG.jellyWidth, 
            CONFIG.jellyHeight, 
            CONFIG.jellyDepth, 
            8, 
            1.2 
        );

        const jellyMat = new THREE.MeshPhysicalMaterial({
            color: CONFIG.colorOff,
            emissive: 0x000000,
            roughness: 0.25,      // Matte
            metalness: 0.3,
            transmission: 0.95,   
            thickness: 2.5,
            transparent: true,
            opacity: 0.5,
            ior: 1.4,
            clearcoat: 0.0,
            side: THREE.DoubleSide
        });

        // 4. Color Influence Light
        const jellyLight = new THREE.PointLight(CONFIG.colorOff, 2.0, 12);
        jellyLight.position.set(0, 0, 0);
        
        // --- Shader Injection ---
        const uniforms = {
            uDeform: { value: 0 },
            uTime: { value: 0 },
            uImpact: { value: 0 }
        };

        jellyMat.onBeforeCompile = (shader) => {
            shader.uniforms.uDeform = uniforms.uDeform;
            shader.uniforms.uTime = uniforms.uTime;
            shader.uniforms.uImpact = uniforms.uImpact;

            shader.vertexShader = `
                uniform float uDeform;
                uniform float uTime;
                uniform float uImpact;
            ` + shader.vertexShader;

            const vertexDisplacement = `
                #include <begin_vertex>
                
                float h = (position.y + ${(CONFIG.jellyHeight * 0.5).toFixed(1)}) / ${CONFIG.jellyHeight.toFixed(1)};
                h = smoothstep(0.0, 1.0, h);
                
                transformed.x -= h * uDeform * 2.0;
                
                transformed.y *= (1.0 - abs(uDeform) * 0.1);
                transformed.z *= (1.0 + abs(uDeform) * 0.05);

                float ripple = sin(length(position.xyz) * 4.0 - uTime * 15.0) * uImpact;
                transformed += normal * ripple * 0.4;
            `;

            shader.vertexShader = shader.vertexShader.replace(
                '#include <begin_vertex>',
                vertexDisplacement
            );
        };

        const jelly = new THREE.Mesh(jellyGeo, jellyMat);
        jelly.add(jellyLight); 
        jelly.castShadow = true;
        jelly.position.y = CONFIG.jellyHeight / 2; 
        scene.add(jelly);

        // --- Interaction ---
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0); 

        // Limit range: straightLen / 2 gives exact inner boundary.
        const limit = straightLen / 2; 

        function getXFromEvent(event) {
            const rect = container.getBoundingClientRect();
            // Handle both Mouse and Touch events generically
            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const clientY = event.touches ? event.touches[0].clientY : event.clientY;

            pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);
            const target = new THREE.Vector3();
            // Raycast against infinite plane ensuring we catch hits even outside visual track
            raycaster.ray.intersectPlane(plane, target);
            return Math.max(-limit, Math.min(limit, target.x));
        }

        function toggleState() {
            state.isOn = !state.isOn;
            state.targetX = state.isOn ? limit : -limit;
            updateStatus();
        }

        function updateStatus() {
            statusText.textContent = state.isOn ? "ON" : "OFF";
            statusText.style.color = state.isOn ? "#ec4899" : "#94a3b8";
            statusText.classList.add('visible');
            uniforms.uImpact.value = 0.4; 
        }

        // --- Robust Event Handling ---

        let startX = 0;
        let startY = 0; // Track Y to detect scrolling vs tapping
        let dragStartTime = 0;

        function onStart(event) {
            state.isDragging = true;
            container.style.cursor = 'grabbing';
            statusText.classList.remove('visible');
            
            // Get initial position immediately for responsiveness
            // But don't move the toggle yet if it's just a tap
        }

        function onMove(event) {
            if (!state.isDragging) return;
            state.targetX = getXFromEvent(event);
        }

        function onEnd(movedDistance) {
            state.isDragging = false;
            container.style.cursor = 'pointer';

            // Snap Logic: If we dragged, check where we ended up
            // If movedDistance is small, we treat it as a tap in the click/touchend handlers
            if (movedDistance > 5) {
                if (state.currentX > 0) {
                    state.isOn = true;
                    state.targetX = limit;
                } else {
                    state.isOn = false;
                    state.targetX = -limit;
                }
                updateStatus();
            }
        }

        // --- Mouse Events ---
        container.addEventListener('mousedown', (e) => {
            startX = e.clientX;
            dragStartTime = Date.now();
            onStart(e);
        });

        window.addEventListener('mousemove', onMove);

        window.addEventListener('mouseup', (e) => {
            if (state.isDragging) {
                const dist = Math.abs(e.clientX - startX);
                const timeDiff = Date.now() - dragStartTime;
                
                // If moved less than 5px or very short duration with little movement, treat as click
                if (dist < 5) {
                    toggleState();
                }
                onEnd(dist);
            }
        });

        // --- Touch Events (Mobile) ---
        container.addEventListener('touchstart', (e) => {
            // e.preventDefault(); // handled by touch-action: none
            if(e.touches.length > 0) {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                dragStartTime = Date.now();
                onStart(e);
            }
        }, {passive: false});

        window.addEventListener('touchmove', (e) => {
            // e.preventDefault(); handled by touch-action: none
            onMove(e);
        }, {passive: false});

        window.addEventListener('touchend', (e) => {
            if (state.isDragging) {
                // For touchend, changedTouches usually contains the lifted finger
                const endX = e.changedTouches[0].clientX;
                const endY = e.changedTouches[0].clientY;
                const dist = Math.sqrt(Math.pow(endX - startX, 2) + Math.pow(endY - startY, 2));
                
                // Tap Threshold: < 10px movement
                if (dist < 10) {
                    toggleState();
                }
                onEnd(dist);
            }
        });

        // --- Responsive Layout & Camera ---
        function adjustLayout() {
            const width = container.clientWidth;
            const height = container.clientHeight;
            const aspect = width / height;

            renderer.setSize(width, height);
            camera.aspect = aspect;
            camera.updateProjectionMatrix();

            // FIXED Zoom for "one size fits all" approach
            // Set to 55 to be comfortably small and minimal on desktop
            // while fitting safely within narrow mobile screens (360px)
            let zoom = 55;

            camera.position.set(0, zoom, zoom);
            camera.lookAt(0, -2, 0);
        }

        window.addEventListener('resize', adjustLayout);
        // Initial call
        adjustLayout();

        // --- Loop ---
        const clock = new THREE.Clock();
        const tempColor = new THREE.Color();

        function animate() {
            requestAnimationFrame(animate);

            const dt = clock.getDelta();
            state.time += dt;
            uniforms.uTime.value = state.time;

            const force = (state.targetX - state.currentX) * CONFIG.springStiffness;
            state.velocity += force;
            state.velocity *= CONFIG.springDamping;
            state.currentX += state.velocity;

            jelly.position.x = state.currentX;

            uniforms.uDeform.value = THREE.MathUtils.lerp(uniforms.uDeform.value, state.velocity * CONFIG.deformMultiplier, 0.3);
            uniforms.uImpact.value = THREE.MathUtils.lerp(uniforms.uImpact.value, 0, 0.1);

            jelly.rotation.z = -state.velocity * 0.1;

            const targetC = state.isOn ? CONFIG.colorOn : CONFIG.colorOff;
            
            // Color Lerp
            jellyMat.color.lerp(tempColor.setHex(targetC), 0.15);
            jellyMat.attenuationColor.lerp(tempColor.setHex(targetC), 0.15);
            jellyLight.color.lerp(tempColor.setHex(targetC), 0.15);
            
            // FIX: Clamp light intensity strongly to prevent "washout" white component
            let lightInt = state.isOn ? 2.0 : 0.5; // Reduced base intensity
            // Limit the velocity boost
            const velocityBoost = Math.min(Math.abs(state.velocity) * 3.0, 1.5);
            lightInt += velocityBoost;
            
            jellyLight.intensity = THREE.MathUtils.lerp(jellyLight.intensity, lightInt, 0.1);

            if(state.isOn) {
                jellyMat.emissive.setHex(targetC);
                jellyMat.emissiveIntensity = THREE.MathUtils.lerp(jellyMat.emissiveIntensity, 0.5, 0.1);
            } else {
                jellyMat.emissiveIntensity = THREE.MathUtils.lerp(jellyMat.emissiveIntensity, 0, 0.1);
            }

            renderer.render(scene, camera);
        }

        state.targetX = -limit;
        animate();

    </script>
</body>
</html>
