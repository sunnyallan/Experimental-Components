<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heavy Architectural Fluted Glass</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #020202;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            text-shadow: 0 2px 15px rgba(0,0,0,1);
            z-index: 10;
        }

        .instructions {
            font-size: 0.8rem;
            opacity: 0.5;
            margin-top: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 900px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 12px;
            color: white;
            z-index: 20;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        @media (min-width: 768px) {
            .controls {
                flex-direction: row;
                align-items: flex-end;
                justify-content: space-between;
                gap: 20px;
            }
        }

        .control-group {
            flex: 1;
            min-width: 140px;
        }

        .control-group label {
            display: block;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            opacity: 0.7;
        }

        .control-group input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #fff;
            display: block;
            margin: 0;
        }

        .input-wrapper {
            display: flex;
            gap: 8px;
        }

        .control-group input[type="text"] {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: white;
            padding: 6px 10px;
            font-size: 0.8rem;
            flex: 1;
            outline: none;
        }

        .control-group input[type="text"]:focus {
            border-color: rgba(255, 255, 255, 0.5);
        }

        .btn {
            background: white;
            color: black;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .file-input-label {
            display: block;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        .value-display {
            float: right;
            font-family: monospace;
        }

        #file-upload {
            display: none;
        }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <h1 style="margin:0; font-weight: 200; letter-spacing: 4px; text-transform: uppercase; font-size: 1.4rem;">Heavy Fluted Slab</h1>
        <p class="instructions">High-Gloss Architectural Convex Ribs</p>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Number of Steps <span class="value-display" id="freq-val">6.0</span></label>
            <input type="range" id="freq-slider" min="1" max="20" step="0.1" value="6.0">
        </div>
        
        <div class="control-group">
            <label>Slab Height <span class="value-display" id="height-val">1.2</span></label>
            <input type="range" id="height-slider" min="0.2" max="2.0" step="0.05" value="1.2">
        </div>

        <div class="control-group">
            <label>Background URL</label>
            <div class="input-wrapper">
                <input type="text" id="url-input" placeholder="Paste image URL...">
                <button class="btn" id="url-btn">Load</button>
            </div>
        </div>

        <div class="control-group" style="flex: 0 0 auto;">
            <label>Upload Image</label>
            <label for="file-upload" class="btn file-input-label">Choose File</label>
            <input type="file" id="file-upload" accept="image/*">
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script id="vertexShader" type="x-shader/x-vertex">
        varying vec2 vUv;
        varying vec2 vScreenSpaceUv;

        void main() {
            vUv = uv;
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vec4 projectionPosition = projectionMatrix * viewMatrix * worldPosition;
            vScreenSpaceUv = (projectionPosition.xy / projectionPosition.w) * 0.5 + 0.5;
            gl_Position = projectionPosition;
        }
    </script>

    <script id="fragmentShader" type="x-shader/x-fragment">
        precision highp float;
        uniform sampler2D uTexture;
        uniform float uFrequency;
        uniform float uDistortion;
        uniform float uBlur;
        uniform float uMagnification;
        uniform float uAspect; 
        
        varying vec2 vUv;
        varying vec2 vScreenSpaceUv;

        float getRibHeight(float x) {
            float activeX = fract(x * uFrequency) * 2.0 - 1.0;
            return sqrt(max(0.0, 1.0 - activeX * activeX));
        }

        float sdRoundedBox(vec2 p, vec2 b, float r) {
            vec2 q = abs(p) - b + r;
            return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
        }

        void main() {
            vec2 centeredUv = (vUv - 0.5);
            vec2 size = vec2(0.5 * uAspect, 0.5);
            vec2 p = centeredUv * vec2(uAspect, 1.0);
            const float r = 0.5;
            float boxDist = sdRoundedBox(p, size, r);
            
            float alpha = 1.0 - smoothstep(-0.002, 0.002, boxDist);
            if (alpha < 0.01) discard;

            const float eps = 0.002;
            float h0 = getRibHeight(vUv.x);
            float h1 = getRibHeight(vUv.x + eps);
            float slope = (h1 - h0) / eps;
            vec3 normal = normalize(vec3(slope, 0.0, 0.7));

            vec2 refractOffset = normal.xy * uDistortion;
            float activeX = fract(vUv.x * uFrequency) - 0.5;
            vec2 magnifiedUv = vScreenSpaceUv + refractOffset;
            magnifiedUv.x += activeX * uMagnification;

            vec3 finalColor = vec3(0.0);
            float totalWeight = 0.0;
            const int samples = 8; 
            const float chromaticSpread = 0.01;

            for(int i = -samples; i <= samples; i++) {
                float progress = float(i) / float(samples);
                float weight = exp(-progress * progress * 4.0); 
                
                vec2 samplePos = magnifiedUv + vec2(0.0, progress * uBlur * 0.04);
                float shift = chromaticSpread * normal.x;
                
                finalColor.r += texture2D(uTexture, samplePos + vec2(shift, 0.0)).r * weight;
                finalColor.g += texture2D(uTexture, samplePos).g * weight;
                finalColor.b += texture2D(uTexture, samplePos - vec2(shift, 0.0)).b * weight;
                
                totalWeight += weight;
            }
            finalColor /= totalWeight;

            vec3 lightDir = normalize(vec3(0.5, 0.5, 1.0));
            vec3 viewDir = vec3(0.0, 0.0, 1.0);
            vec3 halfVector = normalize(lightDir + viewDir);
            
            float nDotH = max(dot(normal, halfVector), 0.0);
            float spec1 = pow(nDotH, 30.0);
            float spec2 = pow(nDotH, 120.0);
            float peakGlint = smoothstep(0.95, 1.0, h0) * 0.4;
            float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 4.0);

            float bevel = smoothstep(0.0, -0.04, boxDist);
            float valleyDarkening = smoothstep(0.0, 1.0, h0);
            
            finalColor *= (0.75 + 0.25 * valleyDarkening);
            finalColor += spec1 * 0.15 + spec2 * 0.45 + peakGlint * 0.2 + fresnel * 0.2;
            finalColor += (1.0 - valleyDarkening) * 0.05;
            finalColor *= (0.8 + 0.2 * bevel);
            finalColor += (1.0 - bevel) * 0.15;

            gl_FragColor = vec4(finalColor, alpha);
        }
    </script>

    <script>
        let scene, camera, renderer;
        let backgroundMesh, glassMesh;
        let isDragging = false;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const offset = new THREE.Vector3();
        const dragPlane = new THREE.Plane();
        const textureLoader = new THREE.TextureLoader();
        
        const DEFAULT_TEXTURE_URL = 'https://images.unsplash.com/photo-1763641302132-d27dad02a19a?q=80&w=2532&auto=format&fit=crop';

        const settings = {
            frequency: 6.0,
            height: 1.2,
            width: 1.2
        };

        function init() {
            scene = new THREE.Scene();
            const aspect = window.innerWidth / (window.innerHeight || 1);
            camera = new THREE.OrthographicCamera(-aspect, aspect, 1, -1, 0.1, 100);
            camera.position.z = 10;

            renderer = new THREE.WebGLRenderer({ 
                antialias: true,
                powerPreference: "high-performance" 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            loadTexture(DEFAULT_TEXTURE_URL);
            setupControls();

            window.addEventListener('resize', onWindowResize);
            const container = document.getElementById('canvas-container');
            container.addEventListener('mousedown', onPointerDown);
            container.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);
            container.addEventListener('touchstart', (e) => onPointerDown(e.touches[0]), {passive: false});
            container.addEventListener('touchmove', (e) => onPointerMove(e.touches[0]), {passive: false});
            container.addEventListener('touchend', onPointerUp);

            animate();
        }

        function loadTexture(url) {
            textureLoader.setCrossOrigin("anonymous");
            textureLoader.load(url, (texture) => {
                texture.minFilter = THREE.LinearFilter;
                
                if (backgroundMesh) {
                    backgroundMesh.material.map = texture;
                    glassMesh.material.uniforms.uTexture.value = texture;
                } else {
                    setupScene(texture);
                }
            }, undefined, (err) => {
                console.error("Texture failed to load", err);
            });
        }

        function setupScene(texture) {
            const aspect = window.innerWidth / (window.innerHeight || 1);
            const bgGeometry = new THREE.PlaneGeometry(aspect * 4, 4);
            const bgMaterial = new THREE.MeshBasicMaterial({ map: texture });
            backgroundMesh = new THREE.Mesh(bgGeometry, bgMaterial);
            scene.add(backgroundMesh);

            const glassGeometry = new THREE.PlaneGeometry(settings.width, settings.height);
            const glassMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    uTexture: { value: texture },
                    uFrequency: { value: settings.frequency }, 
                    uDistortion: { value: 0.28 }, 
                    uBlur: { value: 0.35 },
                    uMagnification: { value: 0.22 },
                    uAspect: { value: settings.width / settings.height }
                },
                vertexShader: document.getElementById('vertexShader').textContent,
                fragmentShader: document.getElementById('fragmentShader').textContent,
                transparent: true
            });

            glassMesh = new THREE.Mesh(glassGeometry, glassMaterial);
            glassMesh.position.z = 1;
            scene.add(glassMesh);
            dragPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, 1));
        }

        function setupControls() {
            const freqSlider = document.getElementById('freq-slider');
            const freqVal = document.getElementById('freq-val');
            const heightSlider = document.getElementById('height-slider');
            const heightVal = document.getElementById('height-val');
            const urlInput = document.getElementById('url-input');
            const urlBtn = document.getElementById('url-btn');
            const fileInput = document.getElementById('file-upload');

            freqSlider.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                settings.frequency = val;
                freqVal.textContent = val.toFixed(1);
                if (glassMesh) glassMesh.material.uniforms.uFrequency.value = val;
            });

            heightSlider.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                settings.height = val;
                heightVal.textContent = val.toFixed(2);
                if (glassMesh) {
                    glassMesh.scale.y = val / 1.2;
                    glassMesh.material.uniforms.uAspect.value = settings.width / val;
                }
            });

            urlBtn.addEventListener('click', () => {
                const url = urlInput.value.trim();
                if (url) loadTexture(url);
            });

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        loadTexture(event.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        function onPointerDown(e) {
            updateMouseCoords(e);
            if (!glassMesh) return;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(glassMesh);
            if (intersects.length > 0) {
                isDragging = true;
                offset.copy(intersects[0].point).sub(glassMesh.position);
            }
        }

        function onPointerMove(e) {
            updateMouseCoords(e);
            if (isDragging && glassMesh) {
                raycaster.setFromCamera(mouse, camera);
                const intersectPoint = new THREE.Vector3();
                raycaster.ray.intersectPlane(dragPlane, intersectPoint);
                glassMesh.position.copy(intersectPoint.sub(offset));
            }
        }

        function onPointerUp() { isDragging = false; }
        function updateMouseCoords(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        }

        function onWindowResize() {
            const aspect = window.innerWidth / (window.innerHeight || 1);
            camera.left = -aspect; camera.right = aspect;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (backgroundMesh) {
                backgroundMesh.geometry.dispose(); 
                backgroundMesh.geometry = new THREE.PlaneGeometry(aspect * 4, 4);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
